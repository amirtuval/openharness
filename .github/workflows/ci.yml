name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      # A Postgres for the suites that test against a real database: `packages/session`'s store
      # tests and `e2e/`, which runs the built server in its own process.
      #
      # The e2e suite reads this service through DATABASE_URL — turbo's default environment
      # mode hands a task only the variables its configuration names, and `e2e/turbo.json` is
      # where DATABASE_URL is passed through for that task. It creates a database of its own
      # per test file (`openharness_e2e_<label>_<random>`, dropped afterwards), so the user
      # has to be allowed to create databases: the image's POSTGRES_USER is a superuser, which
      # is what makes that work.
      #
      # The session tests, by the same rule, do not see DATABASE_URL and still bring up their
      # own `postgres:18-alpine` with testcontainers (Docker is available on the runner).
      # Passing it through for that task too would save them the pull.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: openharness
          POSTGRES_PASSWORD: openharness
          POSTGRES_DB: openharness
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openharness -d openharness"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          # --affected compares against the PR base branch and needs history.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - run: corepack enable

      - id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - run: yarn install --immutable

      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Check dependency rules
        run: yarn check:deps

      - name: Check root formatting
        run: yarn format:check:repo

      # PRs: only packages changed vs the base branch, plus their dependents. `e2e` depends on
      # the server, the client and the web app, so a change to any of those runs the
      # end-to-end suite here too — against the postgres service above.
      - name: Build, typecheck, lint, test (affected)
        if: github.event_name == 'pull_request'
        env:
          # actions/checkout only creates remote-tracking refs, so point turbo at origin/<base>.
          TURBO_SCM_BASE: origin/${{ github.base_ref }}
          # The postgres service above. The session tests truncate their tables, so a scratch
          # database is all this has to be.
          DATABASE_URL: postgres://openharness:openharness@localhost:5432/openharness
        run: yarn turbo run build typecheck lint format:check test --affected --cache-dir=.turbo/cache

      # main: everything (unchanged packages are turbo cache hits).
      - name: Build, typecheck, lint, test (all)
        if: github.event_name != 'pull_request'
        env:
          DATABASE_URL: postgres://openharness:openharness@localhost:5432/openharness
        run: yarn turbo run build typecheck lint format:check test --cache-dir=.turbo/cache
