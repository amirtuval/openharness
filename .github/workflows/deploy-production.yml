name: deploy-production

# Promote a commit that has already been built and deployed to staging, by moving the
# `production` tag (issue #155, epic #148):
#
#   git tag -f production <sha> && git push -f origin production
#
# **Production never builds an image.** It resolves the tag's commit, verifies that staging
# already pushed an image for that exact commit, and fails if it did not — so the only thing
# that can reach production is a build staging has already run and someone has looked at.
# Rolling back is the same command with an earlier SHA: the tag is a pointer, not a marker.
#
# workflow_dispatch re-runs the promotion by hand, which the first-deploy bootstrap needs:
# production's first apply creates the node service account staging's registry must then
# grant read, and until staging has re-applied with TF_PRODUCTION_NODE_SA set the release
# cannot pull its image (ImagePullBackOff). Re-running is the same promotion, by hand:
# docs/DEPLOYMENT.md, "The first deploy".
on:
  push:
    tags: [production]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit to promote. Empty promotes the tip of the ref this is run from.'
        required: false
        type: string

# One production apply at a time, and a queue rather than a cancellation: interrupting an
# apply is how an environment ends up half-changed.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: 'true'
  TERRAFORM_VERSION: '1.9.8'
  # Constants of the epic, matching the defaults in infra/modules/gke/variables.tf and
  # infra/modules/registry's layout — not per-environment settings.
  CLUSTER_NAME: openharness
  REGION: us-central1
  # The registry production pulls from: staging's, in the staging project. This is the one
  # cross-project read deploy@openharness-510710 holds (DEPLOY_CROSS_PROJECT_ROLES).
  REGISTRY_PROJECT_ID: ${{ vars.GCP_PROJECT_ID_STAGING }}
  REGISTRY_HOST: us-central1-docker.pkg.dev
  IMAGE_REPOSITORY: openharness/server

jobs:
  deploy:
    name: verify, deploy and smoke test
    runs-on: ubuntu-latest
    # Matches deploy@openharness-510710's impersonation binding, which admits only jobs
    # running in this GitHub environment.
    environment: production
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Empty on a tag push and on a dispatch with no input (checkout then uses the ref
          # that triggered the run); the commit the run was dispatched for otherwise.
          ref: ${{ inputs.sha }}

      # The checked-out commit. `git rev-parse HEAD` in the tree is the commit the tag points
      # at, whether the tag is annotated or not, and it is what every later step uses — on a
      # dispatch it is the input's commit when one was given, and the ref's tip otherwise.
      - name: Resolve the tag's commit
        id: commit
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Cannot resolve a SHA::'$sha' is not a commit SHA."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          {
            echo "Promoting $sha to production."
            echo
            echo "Tag: \`${GITHUB_REF_NAME}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: google-github-actions/auth@v2
        with:
          # The environment-scoped copies, from the `production` environment.
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      # Every cluster client below — the rollout wait, and the diagnostics step when an apply
      # fails — talks to the cluster through the `gke-gcloud-auth-plugin` exec credential that
      # `gcloud container clusters get-credentials` writes into the kubeconfig. Without the
      # plugin each of them dies with
      # `getting credentials: exec: executable gke-gcloud-auth-plugin not found` (#159). The
      # gcloud that ubuntu-latest ships is the apt build and cannot
      # `gcloud components install` into itself, so the setup-gcloud action installs a Cloud
      # SDK that can and leaves the plugin on PATH for the rest of the job. (`get-credentials`
      # itself needs no plugin — it only writes the kubeconfig; the plugin is what `kubectl`
      # and `helm` run.) The Terraform helm and kubernetes providers are unaffected: they
      # authenticate with the google_client_config token, not this plugin.
      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: 'gke-gcloud-auth-plugin'

      # The gate. Production deploys an image someone else built, and this is where that is
      # proved: `roles/artifactregistry.reader` on the staging project is the only reason
      # deploy@openharness-510710 can run this command at all.
      - name: Verify the image exists in the staging registry
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          image="$REGISTRY_HOST/$REGISTRY_PROJECT_ID/$IMAGE_REPOSITORY:$SHA"
          if ! gcloud artifacts docker images describe "$image" --format='value(image_summary.digest)' >/dev/null 2>&1; then
            echo "::error title=No image for this commit::$image does not exist. Production never builds: deploy this commit to staging first (merge it to main and let CI and deploy-staging run), then move the tag."
            exit 1
          fi
          echo "::notice::$image exists — staging built it."

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Is this the first deploy?
        id: cluster
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          if gcloud container clusters describe "$CLUSTER_NAME" \
            --region "$REGION" --project "$PROJECT_ID" >/dev/null 2>&1; then
            echo "first=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cluster $CLUSTER_NAME exists — a single apply."
          else
            echo "first=true" >> "$GITHUB_OUTPUT"
            echo "::notice::No cluster yet — first deploy, so a targeted apply followed by the full one."
          fi

      - name: terraform init
        working-directory: infra/envs/production
        run: terraform init -input=false -no-color

      # The two applies #153 requires on a fresh project: the helm and kubernetes providers
      # come from module.gke's endpoint and CA, which do not exist until the cluster does.
      - name: terraform apply (first deploy — the cluster and its prerequisites)
        if: steps.cluster.outputs.first == 'true'
        working-directory: infra/envs/production
        env:
          IMAGE_TAG: ${{ steps.commit.outputs.sha }}
          EXISTING_ZONE_NAME: ${{ vars.TF_EXISTING_ZONE_NAME || vars.TF_EXISTING_ZONE_NAME_PRODUCTION }}
          STAGING_NAME_SERVERS: ${{ vars.TF_STAGING_NAME_SERVERS }}
          # The sign-in providers and the alert address (#159). Repository-level variables with
          # an environment suffix — one naming scheme for the deploys and the PR plan, which
          # runs outside any GitHub environment and so can only read repository-level ones.
          # An unset variable still reaches Terraform, as its own default: the -var below always
          # passes a value, and "" is the default of each of these.
          GOOGLE_CLIENT_ID: ${{ vars.OAUTH_GOOGLE_CLIENT_ID_PRODUCTION }}
          GITHUB_CLIENT_ID: ${{ vars.OAUTH_GITHUB_CLIENT_ID_PRODUCTION }}
          MICROSOFT_CLIENT_ID: ${{ vars.OAUTH_MICROSOFT_CLIENT_ID_PRODUCTION }}
          MICROSOFT_TENANT_ID: ${{ vars.OAUTH_MICROSOFT_TENANT_ID_PRODUCTION }}
          ALERT_EMAIL: ${{ vars.TF_ALERT_EMAIL_PRODUCTION }}
          # One billing account for both projects, so this one carries no environment suffix.
          BILLING_ACCOUNT_ID: ${{ vars.TF_BILLING_ACCOUNT_ID }}
          # The monthly budget amount, in the billing account's currency — this account is
          # denominated in ILS, and the module sends no currency code (#159). Unset is not an
          # error: the -var below is only passed when it is set, so Terraform's default stands.
          BUDGET_AMOUNT: ${{ vars.TF_BUDGET_AMOUNT_PRODUCTION }}
        run: |
          set -euo pipefail
          args=(
            -auto-approve -input=false -no-color -lock-timeout=10m
            -var "image_tag=$IMAGE_TAG"
            -var "existing_zone_name=$EXISTING_ZONE_NAME"
            -var "staging_name_servers=${STAGING_NAME_SERVERS:-[]}"
            -var "google_client_id=${GOOGLE_CLIENT_ID:-}"
            -var "github_client_id=${GITHUB_CLIENT_ID:-}"
            -var "microsoft_client_id=${MICROSOFT_CLIENT_ID:-}"
            -var "microsoft_tenant_id=${MICROSOFT_TENANT_ID:-}"
            -var "alert_email=${ALERT_EMAIL:-}"
          )
          # The budget is off unless there is a billing account to put it on — and the account
          # needs roles/billing.costsManager, granted by hand (infra/README.md, "Manual steps").
          # enable_budget is passed either way so the value applied is the one the plan showed.
          if [[ -n "${BILLING_ACCOUNT_ID:-}" ]]; then
            args+=(-var "enable_budget=true" -var "billing_account_id=$BILLING_ACCOUNT_ID")
          else
            args+=(-var "enable_budget=false")
          fi
          # The amount is in the billing account's currency, and the module sends no currency
          # code (#159). Unset means "leave Terraform's default" — it is only passed when the
          # repository variable is set, which is what lets the maintainer change it without a
          # code change.
          if [[ -n "${BUDGET_AMOUNT:-}" ]]; then
            args+=(-var "budget_amount=$BUDGET_AMOUNT")
          fi
          terraform apply "${args[@]}" \
            -target=google_project_service.services \
            -target=module.network \
            -target=module.gke

      - name: terraform apply
        working-directory: infra/envs/production
        env:
          IMAGE_TAG: ${{ steps.commit.outputs.sha }}
          EXISTING_ZONE_NAME: ${{ vars.TF_EXISTING_ZONE_NAME || vars.TF_EXISTING_ZONE_NAME_PRODUCTION }}
          STAGING_NAME_SERVERS: ${{ vars.TF_STAGING_NAME_SERVERS }}
          # Same values as the targeted apply above — every apply reads the same inputs, so a
          # re-deploy cannot drift from the first one (#159).
          GOOGLE_CLIENT_ID: ${{ vars.OAUTH_GOOGLE_CLIENT_ID_PRODUCTION }}
          GITHUB_CLIENT_ID: ${{ vars.OAUTH_GITHUB_CLIENT_ID_PRODUCTION }}
          MICROSOFT_CLIENT_ID: ${{ vars.OAUTH_MICROSOFT_CLIENT_ID_PRODUCTION }}
          MICROSOFT_TENANT_ID: ${{ vars.OAUTH_MICROSOFT_TENANT_ID_PRODUCTION }}
          ALERT_EMAIL: ${{ vars.TF_ALERT_EMAIL_PRODUCTION }}
          BILLING_ACCOUNT_ID: ${{ vars.TF_BILLING_ACCOUNT_ID }}
          BUDGET_AMOUNT: ${{ vars.TF_BUDGET_AMOUNT_PRODUCTION }}
        run: |
          set -euo pipefail

          # Production's zone is created by hand and adopted with an import block, so the
          # variable has no default. Say so in a sentence rather than letting Terraform
          # report a missing variable.
          if [[ -z "$EXISTING_ZONE_NAME" ]]; then
            echo "::error title=Missing variable::Neither TF_EXISTING_ZONE_NAME (production) nor TF_EXISTING_ZONE_NAME_PRODUCTION (repository) is set. It is the resource name of the existing oharness.dev zone — see docs/DEPLOYMENT.md, 'Variables the workflows read'."
            exit 1
          fi

          args=(
            -auto-approve -input=false -no-color -lock-timeout=10m
            -var "image_tag=$IMAGE_TAG"
            -var "existing_zone_name=$EXISTING_ZONE_NAME"
            -var "staging_name_servers=${STAGING_NAME_SERVERS:-[]}"
            -var "google_client_id=${GOOGLE_CLIENT_ID:-}"
            -var "github_client_id=${GITHUB_CLIENT_ID:-}"
            -var "microsoft_client_id=${MICROSOFT_CLIENT_ID:-}"
            -var "microsoft_tenant_id=${MICROSOFT_TENANT_ID:-}"
            -var "alert_email=${ALERT_EMAIL:-}"
          )
          # As in the targeted apply: the budget is on only with a billing account.
          if [[ -n "${BILLING_ACCOUNT_ID:-}" ]]; then
            args+=(-var "enable_budget=true" -var "billing_account_id=$BILLING_ACCOUNT_ID")
          else
            args+=(-var "enable_budget=false")
          fi
          # As in the targeted apply: the amount only when it is set, in the account's currency.
          if [[ -n "${BUDGET_AMOUNT:-}" ]]; then
            args+=(-var "budget_amount=$BUDGET_AMOUNT")
          fi
          terraform apply "${args[@]}"

      # What a failed apply left behind (#159). The release is installed `atomic = true`
      # (infra/modules/app/main.tf), so a rollout that never became ready has **already been
      # rolled back** by the time this runs: the pods are usually gone, and `helm history` may
      # report no release at all. That is why the Kubernetes events (which the cluster keeps
      # for about an hour) and Cloud Logging (which outlives the rollback entirely) are read
      # alongside the live objects — they are the parts of a rolled-back rollout that survive.
      #
      # On a *first* production deploy this is where the bootstrap's ImagePullBackOff shows up:
      # the release never becomes ready, `helm_timeout` expires, and the apply fails before the
      # rollout wait below is ever reached. The events say so.
      #
      # Every probe is best-effort: the step attaches evidence to a failure that has already
      # happened and must never fail the job a second time. It prints names, statuses, events
      # and container logs — never a secret value. `helm history` and the log probes are
      # expected to error on a rolled-back release, which is why each one tolerates a non-zero
      # exit rather than stopping the report.
      - name: Rollout diagnostics (on failure)
        if: failure()
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          # The app module's defaults (infra/modules/app/variables.tf) — the same release and
          # namespace the rollout wait below names.
          NAMESPACE: openharness
          RELEASE_NAME: openharness
          # The chart's selector labels (charts/openharness/templates/_helpers.tpl), scoped by
          # release instance so this never picks up another release's pods.
          POD_SELECTOR: app.kubernetes.io/instance=openharness
        run: |
          set -uo pipefail

          if ! gcloud container clusters get-credentials "$CLUSTER_NAME" \
            --region "$REGION" --project "$PROJECT_ID" 2>&1; then
            echo "::warning title=No cluster credentials::Could not fetch credentials for $CLUSTER_NAME — skipping the Kubernetes diagnostics."
            {
              echo '### Rollout diagnostics'
              echo
              echo "Could not fetch credentials for \`$CLUSTER_NAME\` in \`$PROJECT_ID\` — there is"
              echo "nothing to report from the cluster. The apply's own error is above."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          report="$RUNNER_TEMP/rollout-diagnostics.txt"

          # probe <title> <shell>: a heading, then the command's output from both streams, then
          # the exit code if it failed. Nothing here is allowed to end the step early.
          probe() {
            local title="$1" shell="$2" status=0
            printf '\n===== %s =====\n' "$title"
            bash -c "$shell" 2>&1 || status=$?
            if (( status != 0 )); then printf '(exited %d — continuing)\n' "$status"; fi
          }

          {
            probe "helm -n $NAMESPACE list -a" \
              'helm -n "$NAMESPACE" list -a'
            probe "helm -n $NAMESPACE history $RELEASE_NAME" \
              'helm -n "$NAMESPACE" history "$RELEASE_NAME"'
            probe "kubectl -n $NAMESPACE get pods -o wide" \
              'kubectl -n "$NAMESPACE" get pods -o wide'
            probe "kubectl -n $NAMESPACE describe pods" \
              'kubectl -n "$NAMESPACE" describe pods'
            probe "kubectl -n $NAMESPACE get events --sort-by=.lastTimestamp (last 50)" \
              'kubectl -n "$NAMESPACE" get events --sort-by=.lastTimestamp | tail -50'
            probe "kubectl -n $NAMESPACE logs (current, all containers, tail 200)" \
              'for pod in $(kubectl -n "$NAMESPACE" get pods -l "$POD_SELECTOR" -o name); do echo "--- $pod"; kubectl -n "$NAMESPACE" logs "$pod" --all-containers=true --tail=200; done'
            probe "kubectl -n $NAMESPACE logs --previous (all containers, tail 200)" \
              'for pod in $(kubectl -n "$NAMESPACE" get pods -l "$POD_SELECTOR" -o name); do echo "--- $pod (previous)"; kubectl -n "$NAMESPACE" logs "$pod" --previous --all-containers=true --tail=200; done'
            probe "Cloud Logging — k8s_container in $NAMESPACE, last 30m (needs roles/logging.viewer)" \
              'gcloud logging read "resource.type=\"k8s_container\" AND resource.labels.namespace_name=\"$NAMESPACE\"" --project "$PROJECT_ID" --freshness=30m --limit=200 --format="value(timestamp,resource.labels.pod_name,textPayload,jsonPayload.message)"'
          } > "$report" 2>&1

          cat "$report"
          {
            echo '### Rollout diagnostics'
            echo
            echo 'The release is installed `atomic`, so a failed rollout has already been rolled'
            echo 'back — the events and the Cloud Logging entries are the parts that outlive it.'
            echo
            echo '```'
            cat "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # A rollout that cannot pull its image is the expected end of the *first* production
      # deploy: production's nodes have no read on staging's registry until staging has
      # re-applied with TF_PRODUCTION_NODE_SA set to this project's node service account
      # (docs/DEPLOYMENT.md, "The first deploy"). ImagePullBackOff is a bootstrap step, not a
      # broken deploy, so say so rather than leaving a bare kubectl failure.
      #
      # Since #159 the release is `atomic`, so this step is reached only when the apply itself
      # succeeded — on a first deploy the timeout expires first and the failure surfaces in the
      # diagnostics step above, which reports the same ImagePullBackOff events.
      - name: Wait for the rollout
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          gcloud container clusters get-credentials "$CLUSTER_NAME" \
            --region "$REGION" --project "$PROJECT_ID"
          if kubectl -n openharness rollout status deployment/openharness --timeout=10m; then
            exit 0
          fi
          described="$(kubectl -n openharness describe pods 2>&1 || true)"
          {
            echo '::group::Pods'
            kubectl -n openharness get pods -o wide 2>&1 || true
            printf '%s\n' "$described"
            echo '::endgroup::'
          } >&2
          if grep -qE 'ImagePullBackOff|ErrImagePull' <<<"$described"; then
            echo "::error title=ImagePullBackOff — production cannot pull the image::The pods cannot read the staging registry. On a first production deploy this is the bootstrap: this project's node service account exists now, but staging has not granted it read yet. Set the repository variable and re-run deploy-staging, then re-run this workflow: gh variable set TF_PRODUCTION_NODE_SA --body gke-nodes@openharness-510710.iam.gserviceaccount.com — see docs/DEPLOYMENT.md, 'The first deploy'."
          fi
          exit 1

      # `output url` is `https://<var.host>` — production's hostname, from the state that
      # was just applied, rather than a second copy of it here.
      - name: Smoke test
        working-directory: infra/envs/production
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/.github/scripts/smoke-test.sh" "$(terraform output -no-color -raw url)"
