# Yarn 4 (Berry). Plain node_modules: package folders stay a normal, inspectable tree,
# which keeps every package usable on its own from inside its own folder.
nodeLinker: node-modules

enableTelemetry: false

# Yarn quarantines package versions younger than a day (a supply-chain protection against a
# just-published version). `better-auth` is pinned to the release the session migrations were
# generated from (1.7.7 — see `packages/session/migrations/0011_better_auth.sql`), and the gate
# would refuse that exact version in a fresh clone or in CI for a day after every publish.
# The package is a vetted dependency and the lockfile pins it, so it is preapproved by name.
npmPreapprovedPackages:
  - better-auth@1.7.7
