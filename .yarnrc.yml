# Yarn 4 (Berry). Plain node_modules: package folders stay a normal, inspectable tree,
# which keeps every package usable on its own from inside its own folder.
nodeLinker: node-modules

enableTelemetry: false

# No `npmPreapprovedPackages`: Yarn's quarantine — a package version younger than a day is
# refused, the protection against a freshly published malicious build — applies to every
# package here, `better-auth` and its `@better-auth/*` family included. That is deliberate,
# and why the repo pins a better-auth release old enough to install normally instead of
# exempting the family by name (a name matches every future version, which is exactly the
# supply-chain window the quarantine exists to close).
