# Yarn 4 (Berry). Plain node_modules: package folders stay a normal, inspectable tree,
# which keeps every package usable on its own from inside its own folder.
nodeLinker: node-modules

enableTelemetry: false

# Yarn quarantines a package version younger than a day (a supply-chain protection against a
# just-published build), and `better-auth` publishes its whole `@better-auth/*` family at once.
# The version this repo pins is the release the session migrations were generated from (see
# `packages/session/migrations/0011_better_auth.sql`), so a fresh clone or CI would otherwise
# be unable to install it for a day after every publish. The packages are vetted and the
# lockfile pins the exact versions, so they are preapproved by name — a name without a version
# matches any of its versions, which keeps a better-auth upgrade from tripping over this list.
npmPreapprovedPackages:
  - better-auth
  - '@better-auth/core'
  - '@better-auth/kysely-adapter'
  - '@better-auth/drizzle-adapter'
  - '@better-auth/memory-adapter'
  - '@better-auth/mongo-adapter'
  - '@better-auth/prisma-adapter'
  - '@better-auth/telemetry'
  - '@better-auth/utils'
