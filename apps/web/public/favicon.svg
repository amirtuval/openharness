<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    The openharness mark (#240): a ring left open at the upper right, with a dot in the
    opening — the agent loop, open to the outside. The geometry is canonical: the inline
    component (src/components/logo-mark.tsx) draws the same numbers, and src/icons.test.ts
    keeps the two from drifting.

    The colours are the sRGB the tokens in src/index.css convert to — an SVG favicon cannot
    read a CSS variable, so they are written out. The primary violet (#7C3AED) is the ring on a
    light browser; the media query swaps it for the dark link violet (#A78BFA), because the
    fill violet is only 2.9:1 as ink on a dark background. Chrome, Firefox and Edge apply that
    rule inside an SVG favicon. (A double hyphen is illegal inside an XML comment, so this
    block names the tokens in prose rather than spelling their custom properties.)
  -->
  <style>
    @media (prefers-color-scheme: dark) {
      .ring {
        stroke: #A78BFA;
      }
    }
  </style>
  <circle
    class="ring"
    cx="16"
    cy="16"
    r="10.5"
    fill="none"
    stroke="#7C3AED"
    stroke-width="5"
    stroke-dasharray="51.2 14.8"
    transform="rotate(-6 16 16)"
  />
  <circle cx="23.4" cy="8.6" r="3.6" fill="#FB7185" />
</svg>
