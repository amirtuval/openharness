# The server — one container, one port, the API and the web app together.
#
# Hardened for a shared cluster: it runs as the image's non-root `node` user (uid 1000), with a
# read-only root filesystem, no Linux capabilities, no way to gain privilege, and the default
# seccomp profile. Nothing it needs to write is on the image: the store is Postgres, the static
# assets are read-only, and the one writable path it has is an emptyDir at /tmp.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openharness.fullname" . }}
  labels:
    {{- include "openharness.labels" . | nindent 4 }}
spec:
  # Declared here so the chart is complete without the autoscaler; when the HPA is enabled it
  # owns this field from here on (the two agree at minReplicas == replicaCount == 2).
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # The whole point: a rolling update never takes the last ready pod out of service. One
      # extra pod comes up (maxSurge: 1) and is ready before an old one goes.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "openharness.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openharness.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "openharness.serviceAccountName" . }}
      # Longer than the server's drain timeout (OPENHARNESS_DRAIN_TIMEOUT_MS, 5s by default) and
      # than the load balancer's connection draining, so SIGTERM has time to finish the turns in
      # flight and an in-place migration has time to finish too.
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: openharness
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            # The container cannot gain a privilege it did not start with, cannot write the
            # root filesystem, and holds no Linux capabilities at all.
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            # The image's port, named here so the probes and the Service have one place to
            # point at. Overridable through `env` below, which is where Terraform puts the
            # app's own settings.
            - name: PORT
              value: "3000"
            # The image's root filesystem is read-only, so the two paths a Node process may
            # write to are pointed at the writable emptyDir mounted below.
            - name: TMPDIR
              value: /tmp
            - name: HOME
              value: /tmp
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- range .Values.secrets }}
            # The value itself lives in the mounted file; the server reads it because of the
            # `_FILE` suffix (#154).
            - name: {{ .env }}_FILE
              value: /var/run/secrets/openharness/{{ .secret }}
            {{- end }}
          # Liveness: this process is alive. /health does not touch the database — a database
          # blip must not restart every pod — so this only trips on a wedged event loop.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Readiness: this process can serve. /ready is 503 while the store is down or the pod
          # is draining (W1, #151), which is exactly when it should be taken out of a Service —
          # and out of the load balancer's NEG.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Startup: the first boot runs the Postgres migrations before it listens, which on a
          # cold database can take a while. A generous budget here (5s × 60 = 5 minutes) keeps
          # the liveness probe from killing a pod that is only migrating; once this passes, the
          # liveness probe takes over.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.secrets }}
            - name: secrets
              mountPath: /var/run/secrets/openharness
              readOnly: true
            {{- end }}
      volumes:
        # The one writable path: /tmp, for whatever Node writes there on a read-only rootfs.
        - name: tmp
          emptyDir: {}
        {{- if .Values.secrets }}
        # Secret Manager, through the GKE Secret Manager add-on: the driver fetches each secret
        # into this volume at pod start (and refreshes it), and the Secret Provider Class below
        # says which ones and where they land.
        - name: secrets
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ include "openharness.fullname" . }}
        {{- end }}
