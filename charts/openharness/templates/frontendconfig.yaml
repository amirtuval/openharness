# Sends HTTP to HTTPS. The load balancer still needs an HTTP frontend for the redirect to have
# somewhere to arrive (GKE's ingress creates one alongside the HTTPS one the ManagedCertificate
# backs), so a visitor who typed `staging.oharness.dev` lands on the secure origin rather than a
# dead port.
apiVersion: networking.gke.io/v1beta1
kind: FrontendConfig
metadata:
  name: {{ include "openharness.fullname" . }}
  labels:
    {{- include "openharness.labels" . | nindent 4 }}
spec:
  redirectToHttps:
    enabled: true
    responseCodeName: MOVED_PERMANENTLY_DEFAULT
