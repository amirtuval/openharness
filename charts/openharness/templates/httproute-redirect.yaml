{{- if .Values.gateway.host }}
# Sends HTTP to HTTPS — what the FrontendConfig's `redirectToHttps` did, expressed as a
# RequestRedirect filter (#159). A rule with no `matches` matches every request the route owns,
# and a rule with no `backendRefs` forwards none of them: the load balancer answers the redirect
# itself. 301 is the permanent redirect the FrontendConfig asked for
# (`MOVED_PERMANENTLY_DEFAULT`).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "openharness.fullname" . }}-redirect
  labels:
    {{- include "openharness.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "openharness.fullname" . }}
      sectionName: http
  hostnames:
    - {{ .Values.gateway.host | quote }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
