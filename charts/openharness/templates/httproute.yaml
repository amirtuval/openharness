{{- if .Values.gateway.host }}
# Everything on the https listener goes to the app: the same server answers the API under /v1
# and the web app at /, on port 3000. The Service is the backend — GKE resolves it to a
# **standalone NEG** of its own, which is what keeps traffic pod-IP → pod-IP. The chart
# therefore sets no `cloud.google.com/neg` annotation on the Service any more (it used to, for
# the Ingress): the Gateway controller owns that annotation on a Service it references and
# documents that it must not be modified by hand.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "openharness.fullname" . }}
  labels:
    {{- include "openharness.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "openharness.fullname" . }}
      sectionName: https
  hostnames:
    - {{ .Values.gateway.host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      {{- if .Values.gateway.cdn.enabled }}
      # Cloud CDN, in front of the load balancer's backend service — GKE's HTTPFilter extension,
      # attached the standard Gateway API way (an ExtensionRef in the rule's filters). It has to
      # live in this namespace, and one path rule takes at most one of them.
      filters:
        - type: ExtensionRef
          extensionRef:
            group: networking.gke.io
            kind: GCPHTTPFilter
            name: {{ include "openharness.fullname" . }}-cdn
      {{- end }}
      backendRefs:
        - name: {{ include "openharness.fullname" . }}
          port: 3000
{{- end }}
