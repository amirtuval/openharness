{{- if .Values.ingress.host }}
# The GKE external ingress (class `gce`): the global external HTTPS load balancer with Cloud CDN
# in front, answering on the static IP and serving Google's managed certificate for the host.
#
# The annotations are what tie the three objects together:
#   kubernetes.io/ingress.global-static-ip-name   the google_compute_global_address (TF)
#   networking.gke.io/managed-certificates        the ManagedCertificate above
#   networking.gke.io/v1beta1.FrontendConfig      the FrontendConfig that redirects HTTP→HTTPS
# The backend is the Service, whose NEG annotation and BackendConfig annotation carry the rest.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "openharness.fullname" . }}
  labels:
    {{- include "openharness.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.ingress.staticIpName }}
    kubernetes.io/ingress.global-static-ip-name: {{ . | quote }}
    {{- end }}
    networking.gke.io/managed-certificates: {{ include "openharness.fullname" . }}
    networking.gke.io/v1beta1.FrontendConfig: {{ include "openharness.fullname" . }}
spec:
  ingressClassName: gce
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # Everything: the same server answers the API under /v1 and the web app at /.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "openharness.fullname" . }}
                port:
                  number: 3000
{{- end }}
