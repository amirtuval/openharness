{{- if .Values.secrets }}
# Which Secret Manager secrets the CSI volume above fetches, and the file each lands in.
#
# This is the GKE Secret Manager add-on's provider (`gke`) — the driver is
# `secrets-store-gke.csi.k8s.io`, not the open-source `secrets-store.csi.k8s.io` — and it
# authenticates as the pod's Workload Identity service account, so that GSA needs
# `roles/secretmanager.secretAccessor` on each secret (Terraform's grant, not the chart's).
#
# Each `resourceName` names the secret's `latest` version in `gcpProject`, and `path` is the
# file name under the volume mount, /var/run/secrets/openharness/. The Deployment gives the
# container `<env>_FILE` = that path, and the server reads it (#154):
#   DATABASE_URL_FILE=/var/run/secrets/openharness/database-url
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "openharness.fullname" . }}
  labels:
    {{- include "openharness.labels" . | nindent 4 }}
spec:
  provider: gke
  parameters:
    secrets: |
      {{- range .Values.secrets }}
      - resourceName: "projects/{{ $.Values.gcpProject }}/secrets/{{ .secret }}/versions/latest"
        path: "{{ .secret }}"
      {{- end }}
{{- end }}
