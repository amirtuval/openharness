# The pod's address, and the two annotations that wire it into the load balancer:
#
#   cloud.google.com/neg            "ingress": true — the GKE ingress creates a NEG for this
#                                   Service, so traffic goes pod-IP → pod-IP (container-native
#                                   load balancing) instead of through an extra iptables hop.
#                                   The readiness probe is what removes a draining pod from it.
#   cloud.google.com/backend-config "default": <name> — the BackendConfig that shapes the
#                                   backend service (timeouts, CDN, the /ready health check).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "openharness.fullname" . }}
  labels:
    {{- include "openharness.labels" . | nindent 4 }}
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "{{ include "openharness.fullname" . }}"}'
spec:
  type: ClusterIP
  selector:
    {{- include "openharness.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
