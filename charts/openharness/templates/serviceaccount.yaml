# The identity the pods run as. The annotation is what makes it *be* a Google service account:
# the GKE metadata server exchanges the pod's Kubernetes identity for an access token for this
# GSA (Workload Identity), which is how Cloud KMS wraps the vault's keys and how the Secret
# Manager add-on reads the secrets below. The IAM binding that lets the GSA be impersonated is
# Terraform's, not the chart's.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "openharness.serviceAccountName" . }}
  labels:
    {{- include "openharness.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.gcpServiceAccount }}
  annotations:
    iam.gke.io/gcp-service-account: {{ . | quote }}
  {{- end }}
